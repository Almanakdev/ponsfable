<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PONSFABLE</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="1024x1024" href="/logo.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="description" content="PONSFABLE — a pixel AI chat. Ask Formi anything: write, code, plan, or tell a fable.">
<meta property="og:title" content="PONSFABLE">
<meta property="og:description" content="A pixel AI chat. Ask Formi anything.">
<meta property="og:image" content="/logo.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Pixelify+Sans:wght@500;700&family=Silkscreen:wght@400;700&display=swap">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div class="app">
  <div class="scrim" id="scrim" hidden></div>

  <aside class="rail" id="rail">
    <a class="brand" href="/">
      <img class="px" src="/logo.png" width="36" height="36" alt="">
      <span>PONSFABLE</span>
    </a>
    <button class="btn btn--honey rail-new" type="button" id="newChat">+ New chat</button>
    <div class="rail-label">Recents</div>
    <nav class="rail-list" id="chatList" aria-label="Chats"></nav>
    <div class="rail-foot">
      <div class="rail-model">$FABLE CA</div>
      <code class="rail-ca" id="railCa"></code>
      <button class="btn" type="button" data-copy-ca>Copy CA</button>
      <div class="rail-note">Formi · grok-4.6 · pons.family</div>
    </div>
  </aside>

  <section class="stage">
    <header class="bar">
      <button class="btn btn--dark bar-menu" type="button" id="menuBtn" aria-label="Open chats">☰</button>
      <div class="bar-who">
        <img class="px" src="/logo.png" width="28" height="28" alt="">
        <div>
          <strong>Formi</strong>
          <span id="barStatus">Ready</span>
        </div>
      </div>
      <div class="ca-chip" title="Official $FABLE contract">
        <span class="ca-chip__k">$FABLE</span>
        <code class="ca-chip__v" id="caShort"></code>
        <button class="btn" type="button" data-copy-ca>Copy</button>
      </div>
      <span class="clock" id="clock">00:00:00</span>
    </header>

    <div class="banner" id="demoBanner" hidden>Demo nest — add <code>XAI_API_KEY</code> to <code>.env</code> and restart for live Formi.</div>

    <div class="thread" id="thread"></div>

    <div class="dock">
      <form class="composer" id="composer">
        <textarea id="prompt" rows="1" maxlength="8000" placeholder="Message Formi…" autocomplete="off"></textarea>
        <button class="btn btn--honey" type="submit" id="sendBtn" aria-label="Send">▶</button>
        <button class="btn" type="button" id="stopBtn" hidden>Stop</button>
      </form>
      <p class="fine">Formi can be wrong. Check anything that matters.</p>
    </div>
  </section>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
